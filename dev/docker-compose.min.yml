# Local test bench: WordPress + WooCommerce + the plugin mounted from ../fastflowpe-checkout
services:
  db:
    image: mariadb:10.4
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20
  wordpress:
    image: wordpress:5.4-php7.4-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8074:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      WP_ENVIRONMENT_TYPE: local
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wp:/var/www/html
      - ../fastflowpe-checkout:/var/www/html/wp-content/plugins/fastflowpe-checkout
  wpcli:
    image: wordpress:cli-php7.4
    user: "33:33"
    depends_on:
      - wordpress
    volumes:
      - wp:/var/www/html
      - ../fastflowpe-checkout:/var/www/html/wp-content/plugins/fastflowpe-checkout
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      WP_ENVIRONMENT_TYPE: local
    entrypoint: ["wp", "--path=/var/www/html"]
    profiles: ["cli"]
volumes:
  wp:
